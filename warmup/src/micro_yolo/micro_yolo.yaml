# Ultralytics Micro-YOLO Architecture Configuration for ESP32-S3
# Total parameters: 110,060 (Limit: <= 200,000)
# Input size: 128x128 (Limit: <= 160x160)
# TFLite INT8 size: ~125 KB (Limit: <= 1.5 MB)

nc: 10
scales:
  micro: [0.25, 0.10, 128]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [16, 3, 2]]       # 0: 64x64
  - [-1, 1, Conv, [32, 3, 2]]       # 1: 32x32
  - [-1, 1, C2f, [32, True]]        # 2: 32x32
  - [-1, 1, Conv, [64, 3, 2]]       # 3: 16x16
  - [-1, 1, C2f, [64, True]]        # 4: 16x16
  - [-1, 1, Conv, [96, 3, 2]]       # 5: 8x8
  - [-1, 1, C2f, [96, True]]        # 6: 8x8
  - [-1, 1, SPPF, [96, 5]]          # 7: 8x8

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 8: 16x16
  - [[-1, 4], 1, Concat, [1]]                   # 9: 16x16 cat backbone P4
  - [-1, 1, C2f, [64]]                          # 10: 16x16
  - [-1, 1, Conv, [32, 3, 2]]                   # 11: 8x8
  - [[-1, 7], 1, Concat, [1]]                   # 12: 8x8 cat backbone P5
  - [-1, 1, C2f, [96]]                          # 13: 8x8
  - [[10, 13], 1, Detect, [nc]]                 # 14: Dual-scale Detect (16x16, 8x8)
